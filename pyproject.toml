[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypothesis-highlander"
version = "0.2.0"
description = "Fail-closed Pareto comparison of immutable LABrador hypothesis evidence packets."
requires-python = ">=3.11"
# rfc8785 provides cross-language JCS hashing. The remaining packages support
# the optional legacy visualization/demo; anthropic is an optional demo generator.
dependencies = [
    "numpy>=1.24",
    "plotly>=5.0",
    "rfc8785==0.1.4",
    "streamlit>=1.30",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["highlander*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

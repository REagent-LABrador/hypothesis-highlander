[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hypothesis-highlander"
version = "0.1.0"
description = "Quality-diversity meta-search that sits on top of the LABrador nodes and learns across their outputs to converge on novel program hypotheses for one indication (RA example)."
requires-python = ">=3.11"
# Core loop is stdlib-only. numpy/plotly/streamlit are for the viz + dashboard; anthropic is optional (LLM generator).
dependencies = [
    "numpy>=1.24",
    "plotly>=5.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["highlander*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
